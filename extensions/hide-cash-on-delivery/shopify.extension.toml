api_version = "2026-10"

[[extensions]]
name = "Hide cash on delivery"
handle = "hide-cash-on-delivery"
type = "function"
description = "Hides cash on delivery above an order total or for tagged customers."

  [[extensions.targeting]]
  target = "cart.payment-methods.transform.run"
  input_query = "src/cart_payment_methods_transform_run.graphql"
  export = "cart-payment-methods-transform-run"
  # Top-level keys of this metafield become query variables ($customerTags).
  input_variables = { namespace = "$app", key = "function-configuration" }

  [extensions.build]
  command = ""
  path = "dist/function.wasm"
