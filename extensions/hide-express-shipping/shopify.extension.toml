api_version = "2026-10"

[[extensions]]
name = "Hide express shipping"
handle = "hide-express-shipping"
type = "function"
description = "Hides a shipping option for oversized products and PO box addresses."

  [[extensions.targeting]]
  target = "cart.delivery-options.transform.run"
  input_query = "src/cart_delivery_options_transform_run.graphql"
  export = "cart-delivery-options-transform-run"
  # Top-level keys of this metafield become query variables ($oversizedTags).
  input_variables = { namespace = "$app", key = "function-configuration" }

  [extensions.build]
  command = ""
  path = "dist/function.wasm"
